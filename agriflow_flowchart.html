<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriFlow.ai — Master Technical Architecture Flowchart</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --border: #334155;
      --primary: #10b981;
      --primary-hover: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 1rem 1.5rem;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      z-index: 10;
    }
    .title-area h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #34d399;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .title-area p {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 0.2rem;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .btn {
      padding: 0.5rem 0.9rem;
      font-size: 0.82rem;
      font-weight: 700;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #059669;
      color: white;
      border-color: #10b981;
    }
    .btn-primary:hover {
      background: #047857;
    }
    .btn-secondary {
      background: #334155;
      color: #f1f5f9;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    #viewport {
      flex: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
      position: relative;
    }
    #diagram {
      width: 100%;
      height: 100%;
    }
    .zoom-hint {
      position: absolute;
      bottom: 1rem;
      right: 1.5rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      border-radius: 0.4rem;
      font-size: 0.75rem;
      color: #94a3b8;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-area">
      <h1>🌱 AgriFlow.ai — Master Technical Flowchart</h1>
      <p>Multi-Persona Portals • Dynamic Pricing Engine • Atomic Escrow • Zero-IoT Phone Telemetry • SHA-256 Provenance</p>
    </div>
    <div class="actions">
      <a href="agriflow_flowchart.png" download="agriflow_flowchart.png" class="btn btn-primary">
        📥 Download PNG (High-Res)
      </a>
      <a href="agriflow_flowchart.svg" download="agriflow_flowchart.svg" class="btn btn-secondary">
        📥 Download SVG (Vector)
      </a>
      <a href="agriflow_flowchart.mmd" download="agriflow_flowchart.mmd" class="btn btn-secondary">
        📄 Mermaid Code (.mmd)
      </a>
      <button onclick="zoomIn()" class="btn btn-secondary">➕ Zoom In</button>
      <button onclick="zoomOut()" class="btn btn-secondary">➖ Zoom Out</button>
      <button onclick="resetZoom()" class="btn btn-secondary">🔄 Reset</button>
    </div>
  </header>

  <main id="viewport">
    <div id="diagram">
      <img src="agriflow_flowchart.svg" style="width: 100%; height: 100%; object-fit: contain;" alt="AgriFlow Master Flowchart" />
    </div>
    <div class="zoom-hint">💡 Scroll to zoom, click and drag to pan</div>
  </main>

  <script>
    let panZoomInstance = null;
    window.addEventListener('load', function () {
      panZoomInstance = svgPanZoom('#diagram img', {
        zoomEnabled: true,
        controlIconsEnabled: false,
        fit: true,
        center: true,
        minZoom: 0.2,
        maxZoom: 10
      });
    });

    function zoomIn() {
      if (panZoomInstance) panZoomInstance.zoomIn();
    }
    function zoomOut() {
      if (panZoomInstance) panZoomInstance.zoomOut();
    }
    function resetZoom() {
      if (panZoomInstance) {
        panZoomInstance.resetZoom();
        panZoomInstance.center();
      }
    }
  </script>
</body>
</html>
